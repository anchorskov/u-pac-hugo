{{ define "main" }}
  <main class="main">
    <section class="lookup-container">
      <p class="lookup-intro">Enter your ZIP code below to search for your candidate's details.</p>

      <form id="lookupForm" class="lookup-form">
        <label for="zipInput" class="lookup-label">ZIP Code:</label>
        <input type="text" id="zipInput" class="lookup-input" placeholder="e.g., 90210" required>
        <button class="hero-button-primary" type="submit">Go</button>
      </form>

      <div id="result" class="lookup-result"></div>
    </section>

    <script nonce="{{ .Page.Scratch.Get `nonce` }}">
      window.UPAC_DATA = {{ .Site.Data.upac_representatives | jsonify }};
      window.HUD_ZIP_DATA = {{ .Site.Data.hudzip | jsonify }};
    </script>
    <script nonce="{{ .Page.Scratch.Get `nonce` }}" src="/js/lookup.js"></script>
  </main>
{{ end }}
