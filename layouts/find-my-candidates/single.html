<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-abc123' 'strict-dynamic'; connect-src *;">
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="stylesheet" href="/css/find-candidates.css">
</head>
<body>
  <header>
    <h1>{{ .Title }}</h1>
  </header>

  <main>
    <section class="content">
      {{ .Content }}
    </section>

    <section id="candidate-search">
      <form id="candidateForm" class="zip-form">
        <label for="zipcodeInput" class="zip-label">Enter ZIP Code:</label>
        <input type="text" id="zipcodeInput" name="zipcodeInput" placeholder="e.g., 12345" required class="zip-input">
        <button type="submit" class="zip-button">Find My Candidates</button>
      </form>

      <section id="geolocationSection" class="geolocation-section">
        <button id="geolocateBtn" class="btn btn-secondary" title="Most accurate for mobile users. On desktops, results may reflect your internet location instead of your home address.">
          Use My Device Location
        </button>
      </section>

      <!-- Address Form: Initially Hidden -->
      <section id="addressFormContainer" class="hidden">
        <form id="addressForm" class="address-form">
          <input type="text" id="streetInput" placeholder="Street Address" required>
          <input type="text" id="cityInput" placeholder="City" required>
          <input type="text" id="stateInput" placeholder="State (e.g., WY)" required maxlength="2">
          <input type="text" id="zipAddressInput" placeholder="ZIP Code" required maxlength="5">
          <button type="submit">Search by Address</button>
        </form>
      </section>
    </section>

    <!-- Results section -->
    <section id="candidateResultsSection">
      <h2 id="houseHeader" class="hidden">House of Representatives</h2>
      <p id="incumbentLine" class="hidden">Incumbent</p>
      <div id="candidateResults"></div>
    </section>
    
  </main>

  <footer></footer>

  <script nonce="abc123" src="/js/modal.js"></script>
  <script nonce="abc123" src="/js/find-candidates.js"></script>
</body>
</html>
