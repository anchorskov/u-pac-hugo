<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <!-- CSP updated to include a nonce. 'strict-dynamic' requires the nonce for scripts to load -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-abc123' 'strict-dynamic'; connect-src *;">
</head>
<body>
  <header>
    <h1>{{ .Title }}</h1>
  </header>

  <main>
    <section class="content">
      {{ .Content }}
    </section>

    <section id="candidate-search">
      <form id="candidateForm">
        <label for="zipcodeInput">Enter ZIP Code:</label>
        <input type="text" id="zipcodeInput" name="zipcodeInput" placeholder="e.g., 12345" required>
        <button type="submit">Find My Candidates</button>
      </form>

      <div id="candidateResults"></div>
    </section>
  </main>

  <footer></footer>

  <!-- Script tag now includes the nonce attribute -->
  <script nonce="abc123" src="/js/find-my-candidates.js"></script>
</body>
</html>
