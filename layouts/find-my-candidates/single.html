{{ define "main" }}
<div class="mt-20"></div>
  <section class="content">
    {{ .Content }}
  </section>

  <div class="zip-top-spacer"></div>

  <section id="candidate-search">
    <form id="candidateForm" class="zip-form">
      <label for="zipcodeInput" class="zip-label">Enter ZIP Code:</label>
      <input 
        type="text" 
        id="zipcodeInput" 
        name="zipcodeInput" 
        placeholder="e.g., 90210" 
        required 
        class="zip-input" 
        list="zipSuggestions"
        autocomplete="off"
        maxlength="5"
      />
      <datalist id="zipSuggestions"></datalist>
      <button type="submit" class="inline-block px-4 py-2 text-white bg-blue rounded-md shadow-md transition">
        Find Candidates
      </button>
                    </form>

    <section id="geolocationSection" class="geolocation-section text-center">
      <button id="geolocateBtn" 
        class="inline-block w-auto px-3 py-2 text-white bg-green-600 rounded-md transition hover:bg-green-700">
        Use My Device Location
      </button>
    </section>      

    <div id="locationInfo" class="location-info extracted-style-0"></div>

    <section id="addressFormContainer" class="hidden">
      <form id="addressForm" class="address-form">
        <input type="text" id="streetInput" placeholder="Street Address" required>
        <input type="text" id="cityInput" placeholder="City" required>
        <input type="text" id="stateInput" placeholder="State (e.g., WY)" required maxlength="2">
        <input type="text" id="zipAddressInput" placeholder="ZIP Code" required maxlength="5">
        <button type="submit" class="inline-block px-4 py-2 text-white bg-gray rounded-md transition hover:bg-gray-700">
          Enter My Address
        </button>
      </form>
    </section>
  </section>

  <section id="candidateResultsSection">
    <div id="candidateHeader"></div>
    <div id="candidateResults"></div>
  </section>
{{ end }}

{{ define "scripts" }}
  {{ partial "utils/secure-script.html" (dict "src" "/js/modal.js" "context" .) }}
  {{ partial "utils/secure-script.html" (dict "src" "/js/find-candidates.js" "context" .) }}
{{ end }}
