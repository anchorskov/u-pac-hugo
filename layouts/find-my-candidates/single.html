{{ define "main" }}
  <div style="margin-top: 80px;"></div>

  <section class="content">
    {{ .Content }}
  </section>

  <section id="candidate-search">
    <form id="candidateForm" class="zip-form">
      <label for="zipcodeInput" class="zip-label">Enter ZIP Code:</label>
      <input 
        type="text" 
        id="zipcodeInput" 
        name="zipcodeInput" 
        placeholder="e.g., 90210" 
        required 
        class="zip-input" 
        list="zipSuggestions"
        autocomplete="off"
        maxlength="5"
      />
      <datalist id="zipSuggestions"></datalist>
      <button type="submit" class="zip-button">Find Candidates</button>
    </form>

    <section id="geolocationSection" class="geolocation-section">
      <button 
        id="geolocateBtn" 
        class="btn btn-secondary"
        title="Most accurate for mobile users. On desktops, results may reflect your internet location instead of your home address.">
        Use My Device Location
      </button>
    </section>

    <div id="locationInfo" class="location-info extracted-style-0"></div>

    <section id="addressFormContainer" class="hidden">
      <form id="addressForm" class="address-form">
        <input type="text" id="streetInput" placeholder="Street Address" required>
        <input type="text" id="cityInput" placeholder="City" required>
        <input type="text" id="stateInput" placeholder="State (e.g., WY)" required maxlength="2">
        <input type="text" id="zipAddressInput" placeholder="ZIP Code" required maxlength="5">
        <button type="submit">Enter My Address</button>
      </form>
    </section>
  </section>

  <section id="candidateResultsSection">
    <div id="candidateHeader"></div>
    <div id="candidateResults"></div>
  </section>
{{ end }}

{{ define "scripts" }}
  <script nonce="abc123" src="/js/modal.js"></script>
  <script nonce="abc123" src="/js/find-candidates.js"></script>
{{ end }}
