      type="text" 
      id="zipInput" 
      placeholder="Enter ZIP Code" 
      maxlength="5"
      class="px-4 py-2 border border-gray-300 rounded-md mb-2"

      type="submit" 
      class="inline-block px-4 py-2 bg-blue text-white rounded-md transition hover:bg-blue-700"

  </form>
